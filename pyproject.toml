[project]
name = "ai-engine"
version = "0.1.0"
description = "Local multi-provider AI engine"
readme = "README.md"
authors = [
    { name = "Leo Lima", email = "205528674+LeoLimaTHE-dev@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "google-genai>=2.18.1",
    "openai>=3.1.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
